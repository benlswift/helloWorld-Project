<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title description">
  <title id="title">Outreach Hub architecture</title>
  <desc id="description">A browser loads the public S3 website and calls separate API Gateway REST APIs backed by Lambda. Events, champions, objectives and key results use DynamoDB. Resource uploads and listings use a private S3 bucket; the browser opens files directly using signed URLs. New events trigger SNS email notifications. AWS CDK deploys the infrastructure and website configuration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52657a"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18324c; }
      .title { font-size: 28px; font-weight: bold; }
      .heading { font-size: 19px; font-weight: bold; }
      .label { font-size: 16px; }
      .small { font-size: 14px; }
      .box { stroke-width: 2; rx: 12; }
      .edge { fill: none; stroke: #52657a; stroke-width: 2; marker-end: url(#arrow); }
      .deployment { stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1440" height="1040" fill="#f6f9fc"/>
  <text x="40" y="48" class="title">Outreach Hub - AWS architecture</text>
  <text x="40" y="77" class="label">Current source-defined infrastructure in HelloWorldStack</text>

  <rect x="350" y="110" width="1050" height="855" class="box" fill="#ffffff" stroke="#ccd8e4"/>
  <text x="375" y="141" class="heading">AWS cloud</text>

  <rect x="40" y="165" width="250" height="100" class="box" fill="#edf1ff" stroke="#6878b5"/>
  <text x="65" y="199" class="heading">User browser</text>
  <text x="65" y="226" class="label">HTML / CSS / JavaScript</text>
  <text x="65" y="249" class="small">Event, people and objectives pages</text>

  <rect x="380" y="165" width="330" height="100" class="box" fill="#e9f6ed" stroke="#4e9262"/>
  <text x="400" y="198" class="heading">S3: HelloWorldBucket</text>
  <text x="400" y="226" class="label">Public static website hosting</text>
  <text x="400" y="249" class="small">Site assets + generated config.js API URLs</text>
  <path d="M380 211 H290" class="edge"/>
  <text x="302" y="197" class="small">Site</text>

  <rect x="40" y="300" width="250" height="105" class="box" fill="#f1edf9" stroke="#8a6ead"/>
  <text x="65" y="333" class="heading">AWS CDK deployment</text>
  <text x="65" y="360" class="label">HelloWorldStack</text>
  <text x="65" y="384" class="small">Infrastructure + BucketDeployment</text>
  <path d="M290 346 H325 V248 H380" class="edge deployment"/>
  <text x="45" y="435" class="small">Dashed arrow: website/config deployment.</text>
  <text x="45" y="456" class="small">CDK also provisions all cloud resources.</text>

  <text x="415" y="306" class="heading">API Gateway REST APIs</text>
  <text x="765" y="306" class="heading">AWS Lambda handlers</text>
  <text x="1145" y="306" class="heading">Data / messaging</text>

  <path d="M165 265 V285 H355 V820" fill="none" stroke="#52657a" stroke-width="2"/>
  <text x="184" y="282" class="small">API requests</text>

  <rect x="405" y="330" width="270" height="85" class="box" fill="#fff0f4" stroke="#ba6180"/>
  <text x="425" y="361" class="heading">Events: 4 APIs</text>
  <text x="425" y="389" class="label">List / add / update / remove</text>
  <rect x="735" y="330" width="315" height="85" class="box" fill="#fff3e5" stroke="#c18a43"/>
  <text x="755" y="361" class="heading">Event functions</text>
  <text x="755" y="387" class="small">get / add / update / removeOutreachEvent(s)</text>
  <rect x="1110" y="330" width="265" height="85" class="box" fill="#e9f1ff" stroke="#6385b5"/>
  <text x="1130" y="361" class="heading">DynamoDB</text>
  <text x="1130" y="389" class="label">OutreachEventsTable</text>
  <path d="M355 370 H405 M675 370 H735 M1050 370 H1110" class="edge"/>

  <rect x="405" y="445" width="270" height="85" class="box" fill="#fff0f4" stroke="#ba6180"/>
  <text x="425" y="476" class="heading">Champions: 3 APIs</text>
  <text x="425" y="504" class="label">List / add / update</text>
  <rect x="735" y="445" width="315" height="85" class="box" fill="#fff3e5" stroke="#c18a43"/>
  <text x="755" y="476" class="heading">Champion functions</text>
  <text x="755" y="502" class="small">get / add / updateOutreachChampion(s)</text>
  <rect x="1110" y="445" width="265" height="85" class="box" fill="#e9f1ff" stroke="#6385b5"/>
  <text x="1130" y="476" class="heading">DynamoDB</text>
  <text x="1130" y="504" class="label">OutreachChampionsTable</text>
  <path d="M355 485 H405 M675 485 H735 M1050 485 H1110" class="edge"/>

  <rect x="405" y="560" width="270" height="85" class="box" fill="#fff0f4" stroke="#ba6180"/>
  <text x="425" y="591" class="heading">Objectives: 1 API</text>
  <text x="425" y="619" class="label">List objectives</text>
  <rect x="735" y="560" width="315" height="85" class="box" fill="#fff3e5" stroke="#c18a43"/>
  <text x="755" y="607" class="heading">getObjectives</text>
  <rect x="1110" y="560" width="265" height="85" class="box" fill="#e9f1ff" stroke="#6385b5"/>
  <text x="1130" y="591" class="heading">DynamoDB</text>
  <text x="1130" y="619" class="label">ObjectivesTable</text>
  <path d="M355 600 H405 M675 600 H735 M1050 600 H1110" class="edge"/>

  <rect x="405" y="675" width="270" height="85" class="box" fill="#fff0f4" stroke="#ba6180"/>
  <text x="425" y="706" class="heading">Key results: 1 API</text>
  <text x="425" y="734" class="label">List key results</text>
  <rect x="735" y="675" width="315" height="85" class="box" fill="#fff3e5" stroke="#c18a43"/>
  <text x="755" y="722" class="heading">getKeyResults</text>
  <rect x="1110" y="675" width="265" height="85" class="box" fill="#e9f1ff" stroke="#6385b5"/>
  <text x="1130" y="706" class="heading">DynamoDB</text>
  <text x="1130" y="734" class="label">KeyResultsTable</text>
  <path d="M355 715 H405 M675 715 H735 M1050 715 H1110" class="edge"/>

  <rect x="405" y="790" width="270" height="105" class="box" fill="#fff0f4" stroke="#ba6180"/>
  <text x="425" y="821" class="heading">Resources: 2 APIs</text>
  <text x="425" y="849" class="label">List resources / upload file</text>
  <text x="425" y="873" class="small">prefix = event ID; fileName = file name</text>
  <rect x="735" y="790" width="315" height="105" class="box" fill="#fff3e5" stroke="#c18a43"/>
  <text x="755" y="821" class="heading">getEventResources</text>
  <text x="755" y="845" class="small">List objects + generate signed GET URLs</text>
  <text x="755" y="875" class="heading">addEventResource</text>
  <rect x="1110" y="790" width="265" height="105" class="box" fill="#e9f6ed" stroke="#4e9262"/>
  <text x="1130" y="821" class="heading">S3: EventsBucket</text>
  <text x="1130" y="849" class="label">Private, encrypted, HTTPS only</text>
  <text x="1130" y="873" class="small">Object key: eventID/fileName</text>
  <path d="M355 830 H405 M675 830 H735 M1050 830 H1110" class="edge"/>
  <text x="1054" y="815" class="small">List / put</text>

  <path d="M1050 345 H1080 V198 H1110" class="edge"/>
  <text x="1089" y="284" class="small" transform="rotate(-90 1089 284)">Add event publishes</text>
  <rect x="1110" y="165" width="265" height="100" class="box" fill="#f1edf9" stroke="#8a6ead"/>
  <text x="1130" y="198" class="heading">SNS: EmailTopic</text>
  <text x="1130" y="226" class="label">New event notification</text>
  <text x="1130" y="249" class="small">Email subscription</text>

  <path d="M135 265 V935 H1240 V895" class="edge"/>
  <rect x="515" y="922" width="550" height="26" fill="#ffffff"/>
  <text x="530" y="940" class="small">Open file: browser GET directly to S3 using a signed URL (valid for 1 hour)</text>

  <rect x="40" y="505" width="250" height="120" class="box" fill="#ffffff" stroke="#ccd8e4"/>
  <text x="60" y="539" class="heading">Standalone demo</text>
  <text x="60" y="568" class="label">HelloApi -&gt; HelloLambda</text>
  <text x="60" y="594" class="small">Provisioned by the same stack;</text>
  <text x="60" y="615" class="small">not wired into frontend config.</text>

  <text x="40" y="998" class="label">Grouped for readability: each API is a separate LambdaRestApi with its own Lambda integration.</text>
  <text x="40" y="1023" class="small">Source: lib/hello_world-stack.ts and lambda handlers. Deployment state is not verified by this diagram.</text>
</svg>
