<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBC Outreach Champions</title>
  <link rel="stylesheet" href="css/people.css?v=2">
</head>

<body>
  <outreach-menu-bar active-page="people.html" subheader="Browse and add Outreach Champions"></outreach-menu-bar>

  <main class="content-wrap">
    <table>
      <thead>
        <tr>
          <th>Outreach Champion</th>
          <th>Base Location</th>
          <th>Job Role</th>
          <th>Email Address</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4">Loading Outreach Champions...</td>
        </tr>
      </tbody>
    </table>
  </main>

  <div class="filter-champions">
  <input type="text" id="filter-input" placeholder="Filter by name, location, or role" aria-label="Filter Outreach Champions">
  </div>

  <div class="add-event-form">
    <h3>Add a New Outreach Champion</h3>
    <form id="add-champion-form">
    <input required type="text" id="champion-name" placeholder="Champion Name" aria-label="Champion Name">
    <input required type="text" id="champion-location" placeholder="Base Location" aria-label="Base Location">
    <input required type="text" id="champion-role" placeholder="Job Role" aria-label="Job Role">
    <input required type="email" id="champion-email" placeholder="Email Address" aria-label="Email Address">
    <button id="add-champion-button">Add Outreach Champion</button>
    </form>
  </div>

  <script type="module" src="components/menu-bar.js"></script>
  <script src="config.js?v=3"></script>
  <script src="js/people.js"></script>
</body>

</html>
