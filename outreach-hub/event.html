<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Details for a BBC Outreach Hub event">
  <title>Event Details | BBC Outreach Hub</title>
  <link rel="stylesheet" href="css/event.css">
</head>

<body>
<header class="site-header">
  <img href="index.html" class="bbc-logo" src="bbc-logo-white-rgb.png" alt="BBC Outreach Hub Logo">
  <h1 href="index.html">BBC Outreach Hub</h1>
  <h2>Browse and edit outreach event</h2>
  <a class="back-link" href="index.html">Back</a>
</header>

  <main class="event-page">
    <section class="event-hero" aria-labelledby="event-name">
      <h1 id="event-name">Loading event...</h1>
      <div class="event-meta" aria-label="Event details">
        <p><span class="meta-label">Date</span><time id="event-date">Loading...</time></p>
        <p><span class="meta-label">Location</span><span id="event-location">Loading...</span></p>
      </div>
    </section>
    <button onClick="updateForm(new URLSearchParams(window.location.search).get('id'))" class="update-event-button" id="update-event-button">Update Event</button>
  </main>

  <script src="config.js"></script>
  <script src="js/event.js"></script>
</body>

</html>
