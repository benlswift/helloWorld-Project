<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBC Outreach Hub</title>
  <link rel="stylesheet" href="css/index.css?v=2">
</head>

<body>
  <outreach-menu-bar active-page="index.html" subheader="Browse and create outreach events"></outreach-menu-bar>

  <main class="content-wrap">
    <h2 id="upcoming-events-heading">Upcoming events</h2>
    <table aria-labelledby="upcoming-events-heading">
      <thead>
        <tr>
          <th>Outreach Event</th>
          <th>Location</th>
          <th>Date</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody id="upcoming-events">
        <tr>
          <td colspan="4">Loading outreach events...</td>
        </tr>
      </tbody>
    </table>
    <h2 id="past-events-heading">Past events</h2>
    <table aria-labelledby="past-events-heading">
      <thead>
        <tr>
          <th>Outreach Event</th>
          <th>Location</th>
          <th>Date</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody id="past-events">
        <tr>
          <td colspan="4">Loading outreach events...</td>
        </tr>
      </tbody>
    </table>
  </main>

  <div class="add-event-form">
    <h3>Add a New Outreach Event</h3>
    <input type="text" id="event-name" placeholder="Event Name" aria-label="Event Name">
    <input type="text" id="event-location" placeholder="Location" aria-label="Location">
    <input type="date" id="event-date" placeholder="Date" aria-label="Date">
    <button id="add-event-button">Add Outreach Event</button>
  </div>
  
  <script type="module" src="components/menu-bar.js"></script>
  <script src="config.js"></script>
  <script src="js/index.js?v=3"></script>
</body>

</html>
